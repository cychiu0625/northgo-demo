<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northgo</title>
  <link rel="stylesheet" href="css/site.css?v=1.7.1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body data-page="contact" data-title-key="contactTitle">
  <img class="site-bg" src="img/northgo-hero.jpg" width="1280" height="720" alt="" data-i18n-alt="altHero">
  <a class="skip" href="#main" data-i18n="skip">跳至內容</a>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Northgo"><span class="brand-logo" data-logo></span></a>
    <button class="menu" type="button" aria-expanded="false" data-i18n="menu">選單</button>
    <nav class="nav" aria-label="Primary">
      <a href="index.html" data-nav="home" data-i18n="navHome">首頁</a>
      <a href="services.html" data-nav="services" data-i18n="navServices">服務</a>
      <a href="about.html" data-nav="about" data-i18n="navAbout">關於</a>
      <a href="contact.html" data-nav="contact" data-i18n="navContact">聯絡</a>
      <a class="btn" href="#enquiry" data-i18n="enquire">詢價</a>
    </nav>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-set-lang="zh-tw">繁中</button>
      <button type="button" data-set-lang="en">EN</button>
      <button type="button" data-set-lang="ja">日本語</button>
      <button type="button" data-set-lang="vi">VI</button>
    </div>
  </header>
  <main id="main">
    <section class="hero">
      <div class="wrap">
        <h1 data-i18n="contactTitle">聯絡</h1>
        <p data-i18n="contactLede"></p>
      </div>
    </section>
    <section class="section" id="locations">
      <div class="wrap">
        <div class="regions" role="group">
          <button type="button" data-region="all" aria-pressed="true" data-i18n="all">全部 7</button>
          <button type="button" data-region="taiwan" data-i18n="taiwan">台灣 3</button>
          <button type="button" data-region="japan" data-i18n="japan">日本 2</button>
          <button type="button" data-region="southeast-asia" data-i18n="sea">東南亞 1</button>
          <button type="button" data-region="americas" data-i18n="americas">美洲 1</button>
        </div>
        <p class="lede" id="map-caption"></p>
        <div class="stage">
          <div class="map-frame"><div id="map"></div></div>
          <div class="panel">
            <h2 data-i18n="offices">辦公室</h2>
            <p class="note" data-i18n="listHint"></p>
            <div id="office-list"></div>
          </div>
        </div>
      </div>
    </section>
    <section class="section" id="enquiry">
      <div class="wrap enquiry-sheet">
        <h2>詢價表</h2>
        <p class="note">想問貨運的客戶在這裡填。請用假資料「客戶 A」。按「送出詢問」會新增一筆詢價（不寄信）；成功會顯示句子與編號。</p>
        <form id="enquiry-form" action="#enquiry" method="post" novalidate>
          <div class="pair">
            <label>
              <span>名 <abbr class="req" title="必填">*</abbr></span>
              <input name="given-name" autocomplete="given-name" placeholder="客戶 A" required aria-describedby="err-given-name">
              <span class="field-err" id="err-given-name" hidden></span>
            </label>
            <label>
              <span>姓 <abbr class="req" title="必填">*</abbr></span>
              <input name="family-name" autocomplete="family-name" required aria-describedby="err-family-name">
              <span class="field-err" id="err-family-name" hidden></span>
            </label>
          </div>
          <label>
            <span>公司 <abbr class="req" title="必填">*</abbr></span>
            <input name="company" autocomplete="organization" required aria-describedby="err-company">
            <span class="field-err" id="err-company" hidden></span>
          </label>
          <label>
            <span>電子郵件 <abbr class="req" title="必填">*</abbr></span>
            <input name="email" type="email" autocomplete="email" required aria-describedby="err-email">
            <span class="field-err" id="err-email" hidden></span>
          </label>
          <label>
            <span>電話 <abbr class="req" title="必填">*</abbr></span>
            <input name="phone" type="tel" autocomplete="tel" required aria-describedby="err-phone">
            <span class="field-err" id="err-phone" hidden></span>
          </label>
          <label><span>國家</span>
            <select name="country">
              <option value="">可不選</option>
              <option>台灣</option>
              <option>日本</option>
              <option>越南</option>
              <option>中國</option>
              <option>香港</option>
              <option>新加坡</option>
              <option>馬來西亞</option>
              <option>泰國</option>
              <option>印尼</option>
              <option>菲律賓</option>
              <option>韓國</option>
              <option>印度</option>
              <option>美國</option>
              <option>加拿大</option>
              <option>墨西哥</option>
              <option>英國</option>
              <option>德國</option>
              <option>法國</option>
              <option>荷蘭</option>
              <option>澳洲</option>
              <option>紐西蘭</option>
            </select>
          </label>
          <fieldset>
            <legend>有興趣的服務</legend>
            <div class="checks">
              <label><input type="checkbox" name="services" value="freight">貨運物流</label>
              <label><input type="checkbox" name="services" value="project">專案物流</label>
              <label><input type="checkbox" name="services" value="warehouse">倉儲物流</label>
              <label><input type="checkbox" name="services" value="agency">船務代理</label>
              <label><input type="checkbox" name="services" value="other">其他</label>
            </div>
          </fieldset>
          <label>
            <span>訊息</span>
            <textarea name="message" aria-describedby="err-message"></textarea>
            <span class="field-err" id="err-message" hidden></span>
          </label>
          <label><span>預計出貨時間</span><input name="ship-date" type="date"></label>
          <div class="terms-wrap">
            <label class="terms"><input type="checkbox" name="terms" required aria-describedby="err-terms"><span>我接受條款 <abbr class="req" title="必填">*</abbr></span></label>
            <span class="field-err" id="err-terms" hidden></span>
          </div>
          <button class="btn navy" type="submit" id="enquiry-submit">送出詢問</button>
        </form>
        <p class="form-status" id="form-status" role="status" aria-live="polite" hidden></p>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span data-i18n="footerNote"></span>
      <a href="https://www.northgo.com/" data-i18n="footerLive">開啟正式站</a>
      <a href="sitemap.html">Sitemap</a>
    </div>
  </footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/site.js?v=1.7.1"></script>
  <script src="content/site.js?v=1.7.1"></script>
  <script src="js/contact.js?v=1.7.1"></script>
</body>
</html>
