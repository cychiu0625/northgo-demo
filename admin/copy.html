<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Northgo Admin · 網站內容</title>
  <link rel="stylesheet" href="admin.css?v=1.7.1">
  <style>.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }</style>
</head>
<body data-admin="copy">
  <div class="shell console">
    <header class="top console-top">
      <nav class="tabs" aria-label="Admin">
        <a href="index.html" data-nav="inbox">客戶詢問</a>
        <a href="copy.html" data-nav="copy">網站內容</a>
        <span class="tab-disabled" title="即將開放">媒體</span>
        <span class="tab-disabled" title="即將開放">動態頁面</span>
        <span class="tab-disabled" title="即將開放">使用者</span>
      </nav>
      <div class="top-actions">
        <a class="btn ghost" href="../contact.html#enquiry" target="_blank" rel="noopener">前台詢價</a>
        <button type="button" class="btn ghost" data-logout>登出</button>
      </div>
    </header>
    <main class="console-main">
      <h1>詢價表單文案</h1>
      <p class="lede">維護前台聯絡頁詢價欄位文字。留空的欄位會使用網站預設文案。</p>
      <div class="toolbar">
        <label>語系
          <select id="copy-lang">
            <option value="zh-tw">繁中</option>
            <option value="en">EN</option>
            <option value="ja">日本語</option>
            <option value="vi">VI</option>
          </select>
        </label>
      </div>
      <div class="card">
        <form id="copy-form" class="grid-copy"></form>
        <p class="ok" id="copy-ok" hidden></p>
        <p class="err" id="copy-err" hidden></p>
      </div>
    </main>
  </div>
  <script src="admin.js?v=1.7.1"></script>
</body>
</html>
