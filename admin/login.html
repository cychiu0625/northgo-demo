<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Northgo Admin · Login</title>
  <link rel="stylesheet" href="admin.css?v=1.4.2">
</head>
<body data-admin="login">
  <div class="login-wrap">
    <div class="login-card">
      <h1>Northgo Admin</h1>
      <p class="lede">登入後可管理客戶詢問與表單文案。</p>
      <form id="login-form">
        <label>密碼
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="err" id="login-error" hidden></p>
        <button class="btn primary" type="submit">登入</button>
      </form>
    </div>
  </div>
  <script src="admin.js?v=1.4.2"></script>
</body>
</html>
