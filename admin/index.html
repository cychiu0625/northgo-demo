<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Northgo Admin · Enquiries</title>
  <link rel="stylesheet" href="admin.css?v=1.4.0">
</head>
<body data-admin="inbox">
  <div class="shell">
    <header class="top">
      <a class="brand" href="index.html">Northgo <span>Admin</span></a>
      <nav class="nav" aria-label="Admin">
        <a href="index.html" data-nav="inbox">Enquiries</a>
        <a href="copy.html" data-nav="copy">Form copy</a>
        <button type="button" class="btn ghost" data-logout>Sign out</button>
      </nav>
    </header>
    <main>
      <h1>Enquiry inbox</h1>
      <p class="lede">Review submissions from the public contact form.</p>
      <div class="toolbar">
        <label>Status
          <select id="status-filter">
            <option value="">All</option>
            <option value="new">new</option>
            <option value="read">read</option>
            <option value="done">done</option>
          </select>
        </label>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Service</th>
              <th>Status</th>
              <th>When</th>
            </tr>
          </thead>
          <tbody id="enquiry-list"></tbody>
        </table>
        <p class="empty" id="enquiry-empty" hidden>No enquiries yet.</p>
      </div>
      <div id="enquiry-detail" hidden></div>
    </main>
  </div>
  <script src="admin.js?v=1.4.0"></script>
</body>
</html>
