<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northgo</title>
  <link rel="stylesheet" href="css/site.css?v=1.3.2">
</head>
<body data-page="services" data-title-key="freightTitle">
  <img class="site-bg" src="img/northgo-freight-hero.jpg" width="1280" height="720" alt="">
  <a class="skip" href="#main" data-i18n="skip">跳至內容</a>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Northgo"><span class="brand-logo" data-logo></span></a>
    <button class="menu" type="button" aria-expanded="false" data-i18n="menu">選單</button>
    <nav class="nav" aria-label="Primary">
      <a href="index.html" data-nav="home" data-i18n="navHome">首頁</a>
      <a href="services.html" data-nav="services" data-i18n="navServices">服務</a>
      <a href="about.html" data-nav="about" data-i18n="navAbout">關於</a>
      <a href="contact.html" data-nav="contact" data-i18n="navContact">聯絡</a>
      <a class="btn" href="contact.html#enquiry" data-i18n="enquire">詢價</a>
    </nav>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-set-lang="zh-tw">繁中</button>
      <button type="button" data-set-lang="en">EN</button>
      <button type="button" data-set-lang="ja">日本語</button>
      <button type="button" data-set-lang="vi">VI</button>
    </div>
  </header>
  <main id="main">
    <section class="hero hero-freight">
      <img class="hero-bg" src="img/northgo-freight-hero.jpg" width="1280" height="720" alt="" data-i18n-alt="altFreightHero">
      <div class="wrap">
        <p class="eyebrow" data-i18n="freightEyebrow">海運 · 空運 · 陸運 · 報關</p>
        <h1 data-i18n="freightTitle">貨運物流</h1>
        <p class="lede-line" data-i18n="freightLede"></p>
        <div class="hero-actions">
          <a class="btn" href="contact.html#enquiry" data-i18n="enquire">詢價</a>
          <nav class="hero-links" data-i18n-aria="freightJumps">
            <a href="#ocean" data-i18n="ocean">海運</a>
            <a href="#air" data-i18n="air">空運</a>
            <a href="#land" data-i18n="land">陸運</a>
            <a href="#customs" data-i18n="customs">報關</a>
          </nav>
        </div>
      </div>
    </section>
    <section class="section">
      <div class="wrap grid">
        <article class="card anchor" id="ocean"><b data-i18n="ocean"></b><span data-i18n="oceanLede"></span></article>
        <article class="card anchor" id="air"><b data-i18n="air"></b><span data-i18n="airLede"></span></article>
        <article class="card anchor" id="land"><b data-i18n="land"></b><span data-i18n="landLede"></span></article>
        <article class="card anchor" id="customs"><b data-i18n="customs"></b><span data-i18n="customsLede"></span></article>
      </div>
      <div class="wrap" style="margin-top:18px">
        <a class="btn" href="contact.html#enquiry" data-i18n="enquire">詢價</a>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span data-i18n="footerNote"></span>
      <a href="https://www.northgo.com/" data-i18n="footerLive">開啟正式站</a>
      <a href="sitemap.html">Sitemap</a>
    </div>
  </footer>
  <script src="js/site.js?v=1.3.2"></script>
</body>
</html>
